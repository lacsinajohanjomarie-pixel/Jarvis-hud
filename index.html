<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS HUD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,.035) 1px, transparent 1px),
    #020609;
  background-size: 35px 35px;
  color: #00ffff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

.hud {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(0,255,255,.35);
  padding-bottom: 15px;
  margin-bottom: 20px;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 5px;
  text-shadow: 0 0 15px #00ffff;
}

.clock {
  font-size: 14px;
  color: #8fffff;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 20px;
}

.panel {
  border: 1px solid rgba(0,255,255,.35);
  background: rgba(0,20,25,.65);
  box-shadow: 0 0 20px rgba(0,255,255,.08);
  padding: 18px;
  border-radius: 8px;
}

.panel h2 {
  margin-top: 0;
  font-size: 15px;
  letter-spacing: 2px;
}

.core {
  width: 170px;
  height: 170px;
  margin: 20px auto;
  border: 2px solid #00ffff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow:
    0 0 15px #00ffff,
    0 0 45px rgba(0,255,255,.4);
  animation: pulse 2s infinite;
}

.core::before {
  content: "";
  width: 90px;
  height: 90px;
  border: 2px solid rgba(0,255,255,.6);
  border-radius: 50%;
  box-shadow: 0 0 20px #00ffff;
}

@keyframes pulse {
  50% {
    transform: scale(1.04);
    box-shadow:
      0 0 25px #00ffff,
      0 0 70px rgba(0,255,255,.5);
  }
}

.status {
  line-height: 1.9;
  font-size: 13px;
}

.online {
  color: #00ff88;
}

.feed {
  height: 300px;
  overflow-y: auto;
  border: 1px solid rgba(0,255,255,.2);
  padding: 12px;
  margin-bottom: 15px;
  background: rgba(0,0,0,.25);
}

.message {
  margin-bottom: 12px;
  line-height: 1.5;
  word-wrap: break-word;
}

.user {
  color: #ffffff;
}

.jarvis {
  color: #00ffff;
}

.system {
  color: #777;
  font-size: 12px;
}

.command-row {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  background: #020a0d;
  border: 1px solid rgba(0,255,255,.4);
  color: #00ffff;
  padding: 12px;
  border-radius: 5px;
  outline: none;
}

input:focus {
  border-color: #00ffff;
  box-shadow: 0 0 10px rgba(0,255,255,.2);
}

button {
  background: transparent;
  border: 1px solid #00ffff;
  color: #00ffff;
  padding: 10px 14px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: rgba(0,255,255,.12);
  box-shadow: 0 0 12px rgba(0,255,255,.3);
}

button:active {
  transform: scale(.97);
}

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.task-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.task-list {
  max-height: 220px;
  overflow-y: auto;
}

.task {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-bottom: 1px solid rgba(0,255,255,.12);
  color: #bfffff;
}

.task input {
  flex: 0;
}

.error {
  color: #ff5555;
}

@media (max-width: 750px) {
  .grid {
    grid-template-columns: 1fr;
  }

  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .command-row {
    flex-direction: column;
  }

  .core {
    width: 140px;
    height: 140px;
  }
}
</style>
</head>

<body>

<div class="hud">

<header>
  <div class="logo">JARVIS</div>
  <div class="clock" id="clock">--:--:-- // PH</div>
</header>

<div class="grid">

<div>

<div class="panel">
<h2>AI CORE</h2>

<div class="core"></div>

<div class="status">
<div>AI CORE: <span class="online">ONLINE</span></div>
<div>AUDIO LINK: <span class="online">READY</span></div>
<div>OPTICAL LINK: <span class="online">READY</span></div>
<div>POWER: <span class="online">100%</span></div>
</div>
</div>

<br>

<div class="panel">
<h2>TASK SYSTEM</h2>

<div class="task-row">
<input
  id="taskInput"
  type="text"
  placeholder="Enter task..."
  onkeydown="handleTaskEnter(event)"
>
<button onclick="addTask()">ADD</button>
</div>

<div id="taskList" class="task-list"></div>
</div>

</div>

<div class="panel">

<h2>JARVIS ASSISTANT</h2>

<div id="feed" class="feed">
<div class="message system">Awaiting command...</div>
<div class="message system">All primary systems nominal.</div>
</div>

<div class="command-row">

<input
  id="commandInput"
  type="text"
  placeholder="Speak or type a command..."
  onkeydown="handleEnter(event)"
>

<button onclick="sendCommand()">ASK JARVIS</button>

</div>

<div class="buttons">

<button onclick="startListening()">🎙 LISTEN</button>

<button onclick="clearFeed()">CLEAR FEED</button>

<button onclick="stopSpeaking()">STOP VOICE</button>

</div>

</div>

</div>
</div>

<script>

/* =========================================================
   JARVIS GOOGLE APPS SCRIPT BACKEND
   ========================================================= */

const JARVIS_API_URL =
"https://script.google.com/macros/s/AKfycbwh0NSaJJaqtTzOpsDWGOV1hevaQTf8hSRfYTohgKfn_Fah3L79ITD5T4mAn0r3vaHo3A/exec";


/* =========================================================
   CLOCK
   ========================================================= */

function updateClock() {

  const now = new Date();

  const time = now.toLocaleTimeString(
    "en-PH",
    {
      hour12: false,
      timeZone: "Asia/Manila"
    }
  );

  document.getElementById("clock").textContent =
    time + " // PH";
}

setInterval(updateClock, 1000);
updateClock();


/* =========================================================
   FEED
   ========================================================= */

function addMessage(text, type) {

  const feed = document.getElementById("feed");

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  feed.appendChild(message);

  feed.scrollTop = feed.scrollHeight;
}


function clearFeed() {

  document.getElementById("feed").innerHTML = "";

  addMessage(
    "Feed cleared. JARVIS standing by.",
    "system"
  );
}


/* =========================================================
   JARVIS AI REQUEST
   ========================================================= */

async function askJarvis(message) {

  try {

    const response = await fetch(
      JARVIS_API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          message: message
        })
      }
    );

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );
    }

    const data =
      await response.json();

    if (data.reply) {
      return data.reply;
    }

    if (data.response) {
      return data.response;
    }

    return "JARVIS received no response.";

  } catch (error) {

    console.error(
      "JARVIS connection error:",
      error
    );

    return "Connection to JARVIS failed. Check the backend deployment.";
  }
}


/* =========================================================
   SEND COMMAND
   ========================================================= */

async function sendCommand() {

  const input =
    document.getElementById("commandInput");

  const message =
    input.value.trim();

  if (!message) return;

  input.value = "";

  addMessage(
    "You: " + message,
    "user"
  );

  addMessage(
    "Processing...",
    "system"
  );

  const reply =
    await askJarvis(message);

  const processingMessages =
    document.querySelectorAll(".message.system");

  if (processingMessages.length > 0) {

    const last =
      processingMessages[
        processingMessages.length - 1
      ];

    if (last.textContent === "Processing...") {
      last.remove();
    }
  }

  addMessage(
    "JARVIS: " + reply,
    "jarvis"
  );

  speakJarvis(reply);
}


/* =========================================================
   ENTER KEY
   ========================================================= */

function handleEnter(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    sendCommand();
  }
}


/* =========================================================
   VOICE OUTPUT
   ========================================================= */

function getJarvisVoice() {

  if (!("speechSynthesis" in window)) {
    return null;
  }

  const voices =
    window.speechSynthesis.getVoices();

  if (!voices.length) {
    return null;
  }

  /*
   Try to find a deeper/male English voice.
   Available voices depend on the device/browser.
  */

  const preferredNames = [
    "Daniel",
    "George",
    "Arthur",
    "Alex",
    "Ryan",
    "Google UK English Male",
    "Microsoft George",
    "Microsoft Ryan"
  ];

  for (const name of preferredNames) {

    const found =
      voices.find(v =>
        v.name.toLowerCase().includes(
          name.toLowerCase()
        )
      );

    if (found) {
      return found;
    }
  }

  return (
    voices.find(v =>
      /^en-GB/i.test(v.lang)
    ) ||
    voices.find(v =>
      /^en-US/i.test(v.lang)
    ) ||
    voices.find(v =>
      /^en/i.test(v.lang)
    ) ||
    null
  );
}


function speakJarvis(text) {

  if (!("speechSynthesis" in window)) {

    addMessage(
      "Voice output is not supported on this device.",
      "system"
    );

    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  const voice =
    getJarvisVoice();

  if (voice) {
    speech.voice = voice;
    speech.lang = voice.lang;
  } else {
    speech.lang = "en-US";
  }

  speech.rate = 0.9;
  speech.pitch = 0.75;
  speech.volume = 1;

  window.speechSynthesis.speak(speech);
}


function stopSpeaking() {

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();
  }
}


/*
 Some mobile browsers load voices after the page starts.
*/

if ("speechSynthesis" in window) {

  window.speechSynthesis.onvoiceschanged =
    function() {

      window.speechSynthesis.getVoices();
    };
}


/* =========================================================
   VOICE INPUT
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang = "en-US";

  recognition.interimResults = false;

  recognition.continuous = false;

  recognition.onstart =
    function() {

      addMessage(
        "Listening...",
        "system"
      );
    };


  recognition.onresult =
    function(event) {

      const transcript =
        event.results[0][0].transcript;

      document.getElementById(
        "commandInput"
      ).value = transcript;

      sendCommand();
    };


  recognition.onerror =
    function(event) {

      addMessage(
        "Voice input error: " +
        event.error,
        "system"
      );
    };


  recognition.onend =
    function() {

      console.log(
        "Voice recognition stopped."
      );
    };
}


function startListening() {

  if (!recognition) {

    addMessage(
      "Voice recognition is not supported by this browser. Try Chrome.",
      "system"
    );

    return;
  }

  try {

    recognition.start();

  } catch (error) {

    console.log(
      "Recognition already active."
    );
  }
}


/* =========================================================
   TASK SYSTEM
   ========================================================= */

let tasks = [];

try {

  tasks =
    JSON.parse(
      localStorage.getItem(
        "jarvisTasks"
      ) || "[]"
    );

  if (!Array.isArray(tasks)) {
    tasks = [];
  }

} catch (error) {

  tasks = [];
}


function saveTasks() {

  try {

    localStorage.setItem(
      "jarvisTasks",
      JSON.stringify(tasks)
    );

  } catch (error) {

    console.error(
      "Could not save tasks:",
      error
    );
  }
}


function renderTasks() {

  const list =
    document.getElementById(
      "taskList"
    );

  list.innerHTML = "";

  tasks.forEach(
    function(task, index) {

      const row =
        document.createElement("div");

      row.className = "task";


      const checkbox =
        document.createElement("input");

      checkbox.type = "checkbox";

      checkbox.checked =
        task.completed;


      checkbox.onchange =
        function() {

          tasks[index].completed =
            checkbox.checked;

          saveTasks();

          renderTasks();
        };


      const text =
        document.createElement("span");

      text.textContent =
        task.text;


      if (task.completed) {

        text.style.textDecoration =
          "line-through";

        text.style.opacity =
          "0.5";
      }


      row.appendChild(checkbox);

      row.appendChild(text);

      list.appendChild(row);
    }
  );
}


function addTask() {

  const input =
    document.getElementById(
      "taskInput"
    );

  const text =
    input.value.trim();

  if (!text) return;

  tasks.push({
    text: text,
    completed: false
  });

  saveTasks();

  renderTasks();

  input.value = "";

  addMessage(
    "Task added: " + text,
    "system"
  );
}


function handleTaskEnter(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    addTask();
  }
}


/* =========================================================
   STARTUP
   ========================================================= */

renderTasks();

addMessage(
  "JARVIS systems initialized.",
  "system"
);

</script>

</body>
</html>
